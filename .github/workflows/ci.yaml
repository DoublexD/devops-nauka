name: Flask Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7

      - name: Zainstaluj Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Uruchom testy
        run: python -m unittest discover -s tests -v

      - name: Zbuduj obraz Docker
        run: docker build -t devops-nauka:ci .
      
      - name: przygotuj nazwe obrazu
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:3.0" >> "$GITHUB_OUTPUT"

      - name: zalgouj do ghcr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: $ {{secrets.GITHUB_TOKEN }}

      - name: opublikuj obraz Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run:  
          docker tag devops-nauka:ci "${{ steps.image.outputs.name }}"
        docker push "${{ steps.image.outputs.name }}"