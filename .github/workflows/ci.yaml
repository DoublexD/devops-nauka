name: Flask Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Uruchom testy
        run: python -m unittest discover -s tests -v

      - name: Zbuduj obraz Docker
        run: docker build -t devops-nauka:ci .