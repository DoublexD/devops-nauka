jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: zainstaluj Python 
        uses: actions/setup-python@v5
        with:
        python-version: '3.12'

      - name: zainstaluj biblioteki
        run:pip install -r requirements.txt

      - name: Uruchom testy
        run: python -m unitest discover -s tests -v

      - name: Zbuduj obraz Docker
        run: docker build -t devops-nauka:ci . 